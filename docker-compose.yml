version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: epi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  storage:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  web:
    build: ./backend
    env_file: .env
    depends_on:
      - db
      - redis
      - storage
    ports:
      - "8000:8000"
    command: gunicorn core.wsgi:application -b 0.0.0.0:8000

  worker:
    build: ./backend
    env_file: .env
    depends_on:
      - web
      - redis
      - db
      - storage
    command: celery -A core worker -l INFO

  beat:
    build: ./backend
    env_file: .env
    depends_on:
      - worker
    command: celery -A core beat -l INFO

  inference:
    build: ./inference
    ports:
      - "8500:8500"
    command: uvicorn app:app --host 0.0.0.0 --port 8500 --reload

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - web

volumes:
  pgdata:
  minio:
